<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>物質の状態変化と蒸留｜理科シミュレーター</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f7;font-family:"Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;color:#243748}.wrap{max-width:1100px;margin:auto;padding:14px}.bar{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}button{touch-action:manipulation;cursor:pointer;border:2px solid #cbd8e3;background:white;border-radius:15px;min-height:64px;min-width:74px;font-size:27px;padding:8px 14px}button.active{background:#d9efff;border-color:#2676b8;box-shadow:0 0 0 2px #a6d8ff}button:focus-visible{outline:3px solid #f59e0b}.stage{background:white;border:1px solid #dbe5ec;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px #1c3a5712}svg{width:100%;height:auto;display:block}.controls{display:flex;gap:12px;justify-content:center;margin-top:12px}.controls button{min-width:90px}.hint{display:flex;justify-content:center;gap:12px;align-items:center;margin:10px auto;color:#64748b;font-size:13px}.swatch{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:5px}#bubbleGroup circle{animation:rise 1.7s infinite ease-in;transform-box:fill-box;transform-origin:center}#bubbleGroup circle:nth-child(2){animation-delay:.5s}#bubbleGroup circle:nth-child(3){animation-delay:1s}@keyframes rise{from{transform:translateY(12px);opacity:0}30%{opacity:.9}to{transform:translateY(-30px);opacity:0}}.off #bubbleGroup,.off #vaporDots,.off #drops{display:none}@media(max-width:600px){.wrap{padding:7px}.bar{gap:5px}button{min-width:55px;min-height:53px;font-size:22px;padding:6px 10px}} .heading{padding:20px 8px 16px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#37769b;font-weight:700}.heading h1{font-size:clamp(21px,3.3vw,31px);letter-spacing:.02em;margin:5px 0 8px}.heading p{font-size:14px;color:#64748b;margin:0}.section-title{font-size:14px;font-weight:700;color:#405d70;margin:12px 4px 9px}.bar button{display:flex;align-items:center;flex-direction:column;gap:5px;min-width:126px;min-height:80px;font-size:25px;border-radius:13px}.bar button small{font-size:12px;font-weight:700;white-space:nowrap}.bar{justify-content:flex-start}.controls button{font-size:16px;font-weight:700;min-width:118px;min-height:50px}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.panel{background:white;border:1px solid #dbe5ec;border-radius:15px;padding:17px}.panel h2{font-size:15px;margin:0 0 9px}.panel p{font-size:13px;line-height:1.8;color:#526b7c;margin:0}.note{font-size:12px;line-height:1.7;color:#64748b;margin:13px 4px 20px}.reading{font-size:14px;font-weight:700;color:#245a79;text-align:center;margin:10px}.stage-label{font-size:16px;fill:#405d70;font-weight:700}.stage-sub{font-size:12px;fill:#69869b}@media(max-width:680px){.bar button{min-width:calc(33.333% - 7px);min-height:72px;font-size:23px;padding:6px 3px}.bar button small{font-size:11px}.info{grid-template-columns:1fr}.heading{padding:12px 4px}.controls button{min-width:95px}} </style></head><body><div class="wrap"><header class="heading"><div class="eyebrow">SCIENCE LAB / 中学校理科</div><h1>物質の状態変化と蒸留</h1><p>試料を選び、温度変化と装置内の様子を観察しよう。</p></header><div class="section-title">① 調べる物質を選ぶ</div><div class="bar" id="samples"><button class="active" data-sample="wine" aria-label="ワイン" title="ワイン">🍷<small>ワイン</small></button><button data-sample="ethanol" aria-label="エタノール水溶液" title="エタノール水溶液">🧪<small>エタノール水溶液</small></button><button data-sample="salt" aria-label="食塩水" title="食塩水">🧂<small>食塩水</small></button><button data-sample="water" aria-label="純水" title="純水">💧<small>純水</small></button><button data-sample="ice" aria-label="氷の融解" title="氷の融解">🧊<small>氷</small></button><button data-sample="wax" aria-label="ろうの融解" title="ろうの融解">🕯️<small>ろう</small></button></div><div class="section-title">② 加熱・冷却による変化を観察する</div><div class="stage" id="stage"><svg viewBox="0 0 1000 670" role="img" aria-label="丸底フラスコと冷却器を用いた蒸留装置、温度変化グラフ"><defs><clipPath id="flaskClip"><path d="M219 120 L219 236 C145 259 118 314 147 372 C174 432 274 443 316 386 C362 323 329 266 261 236 L261 120 Z"/></clipPath><linearGradient id="glass" x1="0" x2="1"><stop stop-color="#e5f7ff" stop-opacity=".62"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#d5effa" stop-opacity=".6"/></linearGradient><linearGradient id="flame" x1="0" x2="0" y1="1" y2="0"><stop stop-color="#f97316"/><stop offset="1" stop-color="#fde047"/></linearGradient></defs><rect width="1000" height="670" fill="#fbfdff"/><rect x="24" y="24" width="610" height="460" rx="20" fill="#f1f8fc"/><rect x="652" y="24" width="324" height="460" rx="20" fill="#f7fafc"/><path d="M70 447 H605" stroke="#8498a7" stroke-width="5" stroke-linecap="round"/><path d="M220 117 V233 C140 260 120 322 154 382 C190 444 290 439 325 381 C361 316 327 259 260 233 V117" fill="url(#glass)" stroke="#42677c" stroke-width="6"/><g clip-path="url(#flaskClip)"><rect id="liquid" x="120" y="332" width="240" height="130" fill="#9e4163" opacity=".8"/><path id="surface" d="M120 332 Q180 326 240 332 T360 332" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/><g id="bubbleGroup" fill="#fff" opacity=".8"><circle cx="210" cy="370" r="6"/><circle cx="265" cy="389" r="5"/><circle cx="235" cy="408" r="4"/></g><g id="iceCubes" style="display:none" fill="#d7f4ff" stroke="#7ab5d1" stroke-width="3"><rect x="178" y="345" width="39" height="37" rx="5" transform="rotate(-12 178 345)"/><rect x="240" y="365" width="34" height="35" rx="5" transform="rotate(18 240 365)"/></g></g><path d="M213 119 H267" stroke="#42677c" stroke-width="9"/><path d="M221 116 V74 H260 V116" fill="#c4d3dc" stroke="#42677c" stroke-width="4"/><path d="M240 74 V53 H345 L395 113" fill="none" stroke="#42677c" stroke-width="20" stroke-linejoin="round"/><path d="M240 74 V53 H345 L395 113" fill="none" stroke="#e6f7ff" stroke-width="11" stroke-linejoin="round"/><path d="M380 100 L554 258" stroke="#4c7589" stroke-width="48" stroke-linecap="round"/><path d="M380 100 L554 258" stroke="#b9e9f8" stroke-width="36" stroke-linecap="round"/><path d="M380 100 L554 258" stroke="#f6fdff" stroke-width="12" stroke-linecap="round"/><path d="M375 95 L559 263" stroke="#42677c" stroke-width="4" fill="none"/><path d="M407 122 L432 89 L452 106 L429 139" fill="#b9e9f8" stroke="#42677c" stroke-width="4"/><path d="M490 204 L467 234 L488 251 L513 221" fill="#b9e9f8" stroke="#42677c" stroke-width="4"/><path d="M557 259 L581 282 V310" fill="none" stroke="#42677c" stroke-width="16" stroke-linejoin="round"/><path d="M557 259 L581 282 V310" fill="none" stroke="#e6f7ff" stroke-width="8"/><path d="M563 311 L598 311 L604 419 Q576 450 550 419 L556 311 Z" fill="url(#glass)" stroke="#42677c" stroke-width="4"/><path id="receiverLiquid" d="M552 403 H602 L604 419 Q576 450 550 419 Z" fill="#a9d9f1" opacity=".85"/><g id="drops" fill="#63b4e8"><circle cx="581" cy="330" r="5"/><circle cx="581" cy="359" r="5"/><circle cx="581" cy="384" r="4"/></g><g id="vaporDots" fill="#f59e0b"><circle cx="239" cy="86" r="5"/><circle cx="325" cy="55" r="5"/><circle cx="412" cy="124" r="5"/><circle cx="483" cy="194" r="5"/></g><rect x="183" y="435" width="113" height="13" rx="4" fill="#94a3b8"/><rect x="205" y="450" width="70" height="16" rx="5" fill="#64748b"/><path id="fire" d="M226 432 Q199 409 222 385 Q220 410 242 389 Q267 421 246 432 Z" fill="url(#flame)"/><path d="M418 90 Q440 55 465 75" stroke="#5daac7" stroke-width="7" fill="none"/><path d="M477 251 Q498 274 514 257" stroke="#5daac7" stroke-width="7" fill="none"/><text x="328" y="41" text-anchor="middle" class="stage-label">蒸留装置・状態変化のモデル</text><text x="815" y="48" text-anchor="middle" class="stage-label">温度変化のグラフ</text><text x="818" y="470" text-anchor="middle" class="stage-sub">経過時間 →</text><text x="681" y="252" transform="rotate(-90 681 252)" text-anchor="middle" class="stage-sub">温度 →</text><text x="237" y="285" class="stage-sub" text-anchor="middle">丸底フラスコ</text><text x="470" y="167" class="stage-sub" text-anchor="middle" transform="rotate(42 470 167)">冷却器</text><text x="576" y="300" class="stage-sub" text-anchor="middle">受け器</text><g id="graph"><path d="M699 70 V408 H937" fill="none" stroke="#657b8d" stroke-width="4"/><path d="M699 320 H937 M699 231 H937 M699 142 H937" stroke="#d6e1e9" stroke-width="2" stroke-dasharray="6 7"/><polyline id="curve" points="699,390 735,340 765,290 790,230 820,230 850,230 880,230 920,165" fill="none" stroke="#d55d7d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle id="marker" cx="699" cy="390" r="10" fill="#fff" stroke="#d55d7d" stroke-width="5"/><path id="cursor" d="M699 408 V390" stroke="#d55d7d" stroke-width="2" stroke-dasharray="5 5"/></g><g id="phaseDots" transform="translate(690 435)"><circle cx="15" cy="10" r="8" fill="#8bbfe0"/><circle cx="39" cy="10" r="8" fill="#8bbfe0"/><circle cx="63" cy="10" r="8" fill="#8bbfe0"/><circle cx="87" cy="10" r="8" fill="#8bbfe0"/></g><rect x="24" y="504" width="952" height="143" rx="17" fill="#f0f5f9"/><g id="tubes"><path d="M245 529 V603 Q245 632 272 632 Q299 632 299 603 V529" fill="url(#glass)" stroke="#587b8d" stroke-width="5"/><path d="M251 586 H293 V605 Q293 625 272 625 Q251 625 251 605 Z" fill="#a9d9f1"/><path d="M475 529 V603 Q475 632 502 632 Q529 632 529 603 V529" fill="url(#glass)" stroke="#587b8d" stroke-width="5"/><path d="M481 590 H523 V605 Q523 625 502 625 Q481 625 481 605 Z" fill="#a9d9f1"/><path d="M705 529 V603 Q705 632 732 632 Q759 632 759 603 V529" fill="url(#glass)" stroke="#587b8d" stroke-width="5"/><path d="M711 596 H753 V605 Q753 625 732 625 Q711 625 711 605 Z" fill="#a9d9f1"/></g><g fill="#70869a" font-size="26" font-family="Arial" text-anchor="middle"><text x="272" y="570">1</text><text x="502" y="570">2</text><text x="732" y="570">3</text></g><g id="freezeOverlay" style="display:none"><rect x="350" y="48" width="245" height="50" rx="12" fill="#d7f4ff" stroke="#7ab5d1" stroke-width="3"/><g fill="#5ca5c9"><circle cx="390" cy="73" r="9"/><circle cx="420" cy="73" r="9"/><circle cx="450" cy="73" r="9"/><circle cx="480" cy="73" r="9"/><circle cx="510" cy="73" r="9"/><circle cx="540" cy="73" r="9"/></g></g></svg></div><div class="controls"><button id="play" aria-label="開始・一時停止">▶ 開始</button><button id="reset" aria-label="最初から">↺ 最初から</button><button id="speed" aria-label="再生速度">速度 1×</button></div><div class="reading" id="sampleReading" aria-live="polite"></div><div class="info"><section class="panel"><h2>観察のポイント</h2><p id="question"></p></section><section class="panel"><h2>この試料について</h2><p id="description"></p></section></div><p class="note">※ グラフ・液面・留出液は学習用の模式図です。実測値や厳密な組成変化を示すものではありません。蒸留装置は受け器側が大気に通じる構造を想定し、全体を密閉しません。実際の加熱・蒸留は教員の指導下で行ってください。</p><div class="hint"><span><span class="swatch" style="background:#d55d7d"></span>🌡️</span><span><span class="swatch" style="background:#63b4e8"></span>💧</span><span><span class="swatch" style="background:#f59e0b"></span>♨️</span></div></div><script>const info={wine:['ワイン','加熱を続けると、集まる液体の性質は変化するだろうか。','ワインは水とエタノールなどを含む混合物。両方の成分が蒸発するため、78℃でエタノールだけが出るわけではありません。'],ethanol:['エタノール水溶液','純水と比べ、温度変化の形はどう違うだろうか。','エタノールと水はともに蒸発します。留出液は元の液体よりエタノールが多くなることがあります。'],salt:['食塩水','蒸留で集まる液体と、フラスコに残る物質は何だろうか。','水が主に蒸発して冷却器で液体に戻り、食塩はフラスコ側に残ります。'],water:['純水','沸騰している間、温度はどうなるだろうか。','純水は標準大気圧で約100℃で沸騰します。沸騰中は、加えた熱が主に状態変化に使われます。'],ice:['氷','融けている間、温度はどう変わるだろうか。','純粋な氷は標準大気圧で約0℃で融解します。融解中の温度はほぼ一定です。'],wax:['ろう','純物質のように、一定の温度で融けるだろうか。','一般的なろうは複数の成分を含み、一定の温度範囲で融けることがあります。']};const profiles={wine:{color:'#9e4163',curve:[390,360,325,283,252,225,205,183,161],kind:'distill'},ethanol:{color:'#8ecfe9',curve:[390,352,307,264,244,228,209,191,169],kind:'distill'},salt:{color:'#a4dce8',curve:[390,345,302,260,224,218,208,194,180],kind:'distill'},water:{color:'#a9d9f1',curve:[390,345,300,256,215,215,215,215,215],kind:'distill'},ice:{color:'#bdeaff',curve:[390,345,310,310,310,310,266,225,190],kind:'melt'},wax:{color:'#e5bf68',curve:[390,348,313,290,288,286,260,230,195],kind:'melt'}};let current='wine',progress=0,playing=false,speed=1,raf=0,last=0;const $=id=>document.getElementById(id);function render(){const p=profiles[current],melt=p.kind==='melt';$('liquid').setAttribute('fill',p.color);$('liquid').setAttribute('y',melt?345:332+progress*45);$('iceCubes').style.display=current==='ice'&&progress<.65?'':'none';$('fire').style.display=playing?'':'none';$('stage').classList.toggle('off',!playing||melt);$('freezeOverlay').style.display=melt?'':'none';$('tubes').style.opacity=melt?'.17':'1';const pts=p.curve.map((y,i)=>[699+i*29,y]);$('curve').setAttribute('points',pts.map(x=>x.join(',')).join(' '));const k=progress*(pts.length-1),i=Math.min(Math.floor(k),pts.length-2),a=k-i,x=pts[i][0]+(pts[i+1][0]-pts[i][0])*a,y=pts[i][1]+(pts[i+1][1]-pts[i][1])*a;$('marker').setAttribute('cx',x);$('marker').setAttribute('cy',y);$('cursor').setAttribute('d',`M${x} 408 V${y}`);$('receiverLiquid').style.opacity=melt?'0':String(.25+.75*progress);$('play').textContent=playing?'⏸ 一時停止':'▶ 開始';$('sampleReading').textContent=info[current][0]+' ｜ '+(melt?'融解の観察':'蒸留の観察');$('question').textContent=info[current][1];$('description').textContent=info[current][2]}function choose(s){current=s;progress=0;playing=false;document.querySelectorAll('[data-sample]').forEach(b=>b.classList.toggle('active',b.dataset.sample===s));render()}document.querySelectorAll('[data-sample]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.sample)));$('play').addEventListener('click',()=>{if(progress>=1)progress=0;playing=!playing;last=0;render()});$('reset').addEventListener('click',()=>{progress=0;playing=false;render()});$('speed').addEventListener('click',()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='速度 '+speed+'×'});function tick(t){if(playing){if(last)progress=Math.min(1,progress+(t-last)/23000*speed);if(progress===1)playing=false;render()}last=t;raf=requestAnimationFrame(tick)}render();raf=requestAnimationFrame(tick);</script></body></html>
